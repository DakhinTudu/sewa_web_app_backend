# Production profile — used on Render. All secrets from environment variables.
# Render sets PORT (e.g. 10000); bind to all interfaces so health check can reach the app.
server.port=${PORT:10000}

# Database: set in Render from Neon (no defaults in prod)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Neon (serverless): keep pool small; longer timeout for cold start
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT: must be set in Render (e.g. SEWA_JWT_SECRET). Use a long random string.
sewa.jwt.secret=${SEWA_JWT_SECRET}
sewa.jwt.expiration-ms=${SEWA_JWT_EXPIRATION_MS:86400000}

file.upload-dir=${FILE_UPLOAD_DIR:/tmp/uploads}
logging.level.com.sewa=INFO

# Mail (for forgot-password OTP). Set all SEWA_MAIL_* and SEWA_MAIL_PASSWORD in Render env.
spring.mail.host=${SEWA_MAIL_HOST}
spring.mail.port=${SEWA_MAIL_PORT:587}
spring.mail.username=${SEWA_MAIL_USERNAME}
spring.mail.password=${SEWA_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
sewa.mail.from=${SEWA_MAIL_USERNAME}
sewa.mail.app-name=SEWA

