spring.application.name=Santal-Engineers-Welfare-Association
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sewa_welfare_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Local dev only; in production set SEWA_JWT_SECRET in Render (see DEPLOY.md)
sewa.jwt.secret=${SEWA_JWT_SECRET:9a67471ec639f4ff3b1f8f29810738470a73c5240a1fef3e3f421f6b2c2b7d9c}
sewa.jwt.expiration-ms=${SEWA_JWT_EXPIRATION_MS:86400000}
file.upload-dir=${FILE_UPLOAD_DIR:uploads}

# SMTP (e.g. Gmail) – for forgot-password OTP. Set SEWA_MAIL_* and SEWA_MAIL_PASSWORD in env (no defaults in repo).
spring.mail.host=${SEWA_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SEWA_MAIL_PORT:587}
spring.mail.username=${SEWA_MAIL_USERNAME:}
spring.mail.password=${SEWA_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
sewa.mail.from=${SEWA_MAIL_USERNAME:}
sewa.mail.app-name=SEWA

logging.level.com.sewa=DEBUG
spring.sql.init.mode=always
